<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>职工电子工牌</title>

  <!-- ===== iOS 添加到主屏幕后全屏独立运行 ===== -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="电子工牌">

  <!-- ===== 主屏幕图标（180x180，放同目录）===== -->
  <link rel="apple-touch-icon" href="./icon-180.png">
  <!-- ========================================= -->

  <script>
    /* ===== 可修改资料（证件照请替换同目录下的 photo.jpg）===== */
    const STAFF = {
      name: "徐慧苹",
      department: "外科门诊 (2)",
      title: "主管护师",
      employeeId: "178601"
    };
    /* ======================================================== */
  </script>

  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #0e3c38;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    /* iPhone 15 Pro：背景从物理顶端铺满，内容避开灵动岛安全区 */
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: pan-y;
      min-height: 100vh;
      min-height: 100dvh;                      /* 动态视口高度，更准 */
      padding-top: env(safe-area-inset-top);    /* iPhone 15 Pro = 59pt */
      padding-bottom: env(safe-area-inset-bottom); /* 避开底部 Home 横条 */
    }

    .screen {
      position: relative;
      width: min(100vw, 946px);
      aspect-ratio: 946 / 1948;
      overflow: hidden;
      container-type: inline-size;
      background: #2f8378 url("./ui-bg.jpg") center top / 100% 100% no-repeat;
      pointer-events: none;
    }

    .erase {
      position: absolute;
      background: rgba(251, 252, 252, .985);
    }

    .photo-wrap {
      position: absolute;
      left: 8.46%;
      top: 12.32%;
      width: 24.74%;
      aspect-ratio: 234 / 302;
      overflow: hidden;
      border-radius: 2.15cqw;
      background: #cc3137;
    }
    .photo-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .name-box {
      left: 34.7%;
      top: 12.05%;
      width: 53.5%;
      height: 5.2%;
      display: flex;
      align-items: center;
      padding-left: .9cqw;
    }
    .name {
      color: #050505;
      font-size: 5.75cqw;
      line-height: 1;
      font-weight: 500;
      letter-spacing: .05em;
      white-space: nowrap;
    }

    .info-box {
      left: 34.5%;
      top: 19.25%;
      width: 54.2%;
      height: 9.1%;
      padding: .9cqw 0 0 1.5cqw;
      color: #050505;
      font-size: 3.92cqw;
      font-weight: 600;
      line-height: 1.5;
      white-space: nowrap;
    }

    .clock-box {
      left: 9.8%;
      top: 64.75%;
      width: 80.4%;
      height: 7.1%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #030303;
      font-family: "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
      font-size: 7.65cqw;
      font-weight: 600;
      font-stretch: condensed;
      letter-spacing: .005em;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="screen" aria-label="郑州大学第一附属医院职工电子工牌">
    <div class="photo-wrap"><img src="./photo.jpg" alt="证件照"></div>

    <div class="erase name-box"><span class="name" id="staff-name"></span></div>
    <div class="erase info-box">
      <div>科室：<span id="staff-department"></span></div>
      <div>职称：<span id="staff-title"></span></div>
      <div>工号：<span id="staff-id"></span></div>
    </div>

    <div class="erase clock-box" id="clock"></div>
  </main>

  <script>
    const byId = id => document.getElementById(id);
    byId("staff-name").textContent = STAFF.name;
    byId("staff-department").textContent = STAFF.department;
    byId("staff-title").textContent = STAFF.title;
    byId("staff-id").textContent = STAFF.employeeId;

    function pad(value) { return String(value).padStart(2, "0"); }
    function refreshClock() {
      const now = new Date();
      byId("clock").textContent =
        `${pad(now.getMonth() + 1)}-${pad(now.getDate())} ` +
        `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
    refreshClock();
    setInterval(refreshClock, 250);

    // 页面仅展示：拦截所有点击、拖拽和长按菜单。
    document.addEventListener("click", event => event.preventDefault(), true);
    document.addEventListener("dragstart", event => event.preventDefault(), true);
    document.addEventListener("contextmenu", event => event.preventDefault(), true);
  </script>
</body>
</html>
